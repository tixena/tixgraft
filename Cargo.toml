[package]
name = "tixgraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A CLI tool for fetching reusable components from Git repositories or local paths"
license = "MIT"
repository = "https://github.com/tixena/tixgraft"
keywords = ["cli", "git", "scaffolding", "templates"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
include = ["/src/**/*.rs", "/skills/**", "/docs/schema.json", "/README.md", "/LICENSE"]

[[bin]]
name = "tixgraft"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }

serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "2"

jsonschema = "0.60.2"
serde_json = "1"

# ssh/https are opt-in from git2 0.21 onward; both transports are required.
git2 = { version = "0.21.0", features = ["ssh", "https"] }

os-shim = "0.4"

# Waits on os-shim's futures and streams from synchronous code
pollster = "1.0.1"
futures-util = { version = "0.3.34", default-features = false, features = ["io", "std"] }

tempfile = "3"
ignore = "0.4"

anyhow = "1.0"
thiserror = "2"

dirs = "7"

regex = "1.13.1"

tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
include_dir = "0.7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"
pub_with_shorthand = "allow"
module_name_repetitions = "allow"
question_mark_used = "allow"
self_named_module_files = "allow"
separated_literal_suffix = "allow"
single_call_fn = "allow"
print_stderr = "allow"
# Contradicts rest_pattern_accessible_field; only one of the pair can be enforced.
unneeded_field_pattern = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
